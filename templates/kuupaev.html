{% extends "base.html" %}

{% block title %}Kuupäev sõnena{% endblock %}
{% block pealkiri %}6.4c – Kuupäev sõnena{% endblock %}

{% block sisu %}
<form method="post">
  <label>Sisesta kuupäev kujul PP.KK.AAAA (nt 24.02.1918):
    <input type="text" name="kuupaev" placeholder="PP.KK.AAAA" pattern="\d{2}\.\d{2}\.\d{4}" required>
  </label>
  <button type="submit">Teisenda</button>
</form>

{% if tulemus is not none %}
<h2>Tulemus</h2>
<pre>{{ tulemus }}</pre>
{% endif %}
{% endblock %}
