<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Programmeerimise alused I{% endblock %}</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9f9f9;
      color: #222;
    }
    h1 { border-bottom: 2px solid #333; padding-bottom: 8px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input[type="text"],
    input[type="number"] {
      padding: 6px 10px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      margin-bottom: 14px;
    }
    button[type="submit"] {
      padding: 8px 20px;
      font-size: 1rem;
      background: #2a6496;
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 3px;
    }
    button[type="submit"]:hover { background: #1d4e78; }
    pre {
      background: #eef;
      border-left: 4px solid #2a6496;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 1rem;
    }
    a.tagasi {
      display: inline-block;
      margin-bottom: 20px;
      color: #2a6496;
      text-decoration: none;
      font-size: 0.95rem;
    }
    a.tagasi:hover { text-decoration: underline; }
  </style>
</head>
<body>
  {% block tagasi %}
  <a class="tagasi" href="/">&larr; Tagasi avakuvale</a>
  {% endblock %}
  <h1>{% block pealkiri %}{% endblock %}</h1>
  {% block sisu %}{% endblock %}
</body>
</html>
