{% extends "base.html" %}

{% block title %}Peo eelarve{% endblock %}
{% block pealkiri %}6.3 – Peo eelarve{% endblock %}

{% block sisu %}
<form method="post">
  <label>Mitu inimest on kutsutud:
    <input type="number" name="guests" min="0" required>
  </label>
  <label>Mitu inimest tuleb (on teatanud):
    <input type="number" name="yes" min="0" required>
  </label>
  <button type="submit">Arvuta</button>
</form>

{% if tulemus is not none %}
<h2>Tulemus</h2>
<pre>{{ tulemus }}</pre>
{% endif %}
{% endblock %}
