{% extends "base.html" %}

{% block title %}Reklaam (bänner){% endblock %}
{% block pealkiri %}6.1 – Reklaam (bänner){% endblock %}

{% block sisu %}
<form method="post">
  <label>Mitu korda soovite reklaamlauset kuvada:
    <input type="number" name="mitu" min="1" required>
  </label>
  <label>Sisestage reklaamlause:
    <input type="text" name="sisu" required>
  </label>
  <button type="submit">Kuva</button>
</form>

{% if tulemus is not none %}
<h2>Tulemus</h2>
<pre>{{ tulemus }}</pre>
{% endif %}
{% endblock %}
